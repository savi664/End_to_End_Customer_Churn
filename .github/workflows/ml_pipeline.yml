name: ML Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app.py src

      - name: Import smoke test
        run: python -c "from src.api import app; from src.deploy_model import get_model_info, predict_churn; from src.preprocessing import build_processed_dataset; from src.crm_integration import build_crm_export; from src.drift_monitor import compute_psi; from src.ab_testing import simulate_ab_test; print('All imports OK')"
